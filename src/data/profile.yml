name: Burak Üren
handle: burakuren
role: Backend Engineer
tagline: I build the parts of a web product you don't see, and keep them running.
lead: >-
  User accounts, payments, search, background jobs and the servers
  underneath. For **3+ years** I've built them in Python, with Django and
  Flask, for products used by thousands of people, including a tutoring
  marketplace I founded.
availability: Open to a new role or project
seoTitle: Burak Üren | Backend Engineer in Istanbul (Python, Django)
seoDescription: Backend engineer in Istanbul with 3+ years of building REST APIs, payments, background jobs and the servers under them in Python, Django and Flask.
services:
  - flag: --build
    title: Build your backend
    body: APIs, databases, sign-in, permissions and payments for a web or mobile product, designed so the next feature is easy to add.
    proof: The REST API and **4** background services behind SMGrader, an AI grading platform.
  - flag: --tune
    title: Make it faster and cheaper
    body: 'Find what is slow or expensive and fix it: caching, query tuning, leaner servers and smaller deploys.'
    proof: Cut BanaDersBul's hosting bill from **$180** to **$40** a month by moving off Kubernetes.
  - flag: --keep-it-running
    title: Ship it and keep it running
    body: Automated tests and deploys, logs and alerts, so problems get caught before your users notice them.
    proof: Logging and alerts at SMGrader that turned failure triage from **hours into minutes**.
about:
  - >-
    I got into backend work by building my own product. In 2021 I launched
    BanaDersBul to connect private tutors with students, and I've run it end
    to end ever since: the API, the database, the servers and every deploy.
  - >-
    That taught me to care about the things users only notice when they
    break. I work test-first, in small reviewed changes, with automated
    deploys that make releasing boring. I like caching and fast queries, logs
    you can actually search, and infrastructure that is no more complicated
    than it needs to be.
  - >-
    Linux is home; most of my day happens in a terminal, which is why this
    site looks a little like one.
