entries:
  - role: Backend Engineer
    org: MatFabe
    url: https://tavsiye.matfabe.com
    ref: HEAD
    start: 2026-03
    summary: >-
      A referral platform for a private tutoring service: parents and students
      invite others, and the team follows up each lead in order. Live in
      production.
    results:
      - value: ~100
        label: people using it
      - value: 50+
        label: referrals tracked end to end
      - value: Every release
        label: checked by an automated test suite before it ships
    highlights:
      - Django and PostgreSQL; multi-level referrer network and an ordered outreach pipeline with enforced stage transitions.
      - Test-first in Scrum iterations; pytest and factory-boy suite guards every release.
      - Dockerized; GitHub Actions CI/CD ships versioned images to DigitalOcean Container Registry.
    stack: [django, postgresql, htmx, docker, github actions]
  - role: Backend Engineer
    org: SMGrader
    start: 2022-10
    end: 2025-11
    summary: >-
      An AI-powered grading platform: it grades student work and syncs the
      results with the school's learning system. I built most of its server
      side over three years.
    results:
      - value: 80%
        label: fewer repeated database reads after adding a shared cache
      - value: Hours to minutes
        label: to find out why a grading job failed
      - value: ~20%
        label: of jobs cancelled early, so they never cost an AI call
    highlights:
      - REST API in Django REST Framework plus **4** async microservices on Celery, RabbitMQ and Redis.
      - Organization-level RBAC on Django's permission framework; Stripe with per-user token budgets.
      - Background job system handling **hundreds** of grading jobs a day; graceful cancellation via a Redis flag.
      - Redis read-through cache with TTL for metadata shared across tasks.
      - Message-level logging and alerting with Grafana, Loki and Slack; two-way Canvas LMS sync.
      - AWS (RDS, S3, EKS, ElastiCache) deployed through Jenkins; helped DevOps with Kubernetes scaling.
    stack: [drf, celery, rabbitmq, redis, stripe, aws, grafana]
  - role: Founder and Backend Engineer
    org: BanaDersBul
    url: https://www.banadersbul.com
    ref: side project
    start: 2021-01
    summary: >-
      A marketplace that matches students with private tutors in Turkey. I
      started it, built it and still run everything behind the site: accounts,
      search, file downloads and servers.
    results:
      - value: 5,000+
        label: registered users
      - value: $180 to $40
        label: monthly hosting cost
      - value: Hundreds to tens
        label: of milliseconds for repeat searches
    highlights:
      - Flask REST API with SQLAlchemy (Alembic migrations) and PostgreSQL full-text search.
      - Search results cached in Redis keyed by a query hash.
      - JWT auth for logins, secure file downloads, password resets and admin impersonation; Flask-Admin panel.
      - Migrated from DigitalOcean Kubernetes to a self-managed Docker Compose server.
      - One-click GitHub Actions deploys with SOPS + age encrypted secrets; hardened SSH, UFW firewall, fail2ban.
      - Docker images shrunk from **1.14 GB** to **199 MB**; **3** repos merged into a monorepo; build and push from **~10** to **2 min**.
    stack: [flask, sqlalchemy, postgresql, redis, docker compose, caddy]
