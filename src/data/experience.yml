entries:
  - role: Backend Engineer
    org: MatFabe
    url: https://tavsiye.matfabe.com
    ref: HEAD
    start: 2026-03
    summary: >-
      A referral platform for a private tutoring service: parents and students
      invite others, and the team follows up each lead in order. I'm the sole
      backend engineer and built it from scratch; it is live in production.
    results:
      - value: 60+
        label: referrers in a multi-level network
      - value: From scratch
        label: designed and built as the sole backend engineer
      - value: Every release
        label: checked by an automated test suite before it ships
    highlights:
      - Django, HTMX and PostgreSQL; multi-level referrer network and an outreach pipeline with enforced stage transitions.
      - Test-first in Scrum iterations; pytest, factory-boy and mypy checks guard every release.
      - Dockerized; GitHub Actions CI/CD ships versioned images to DigitalOcean Container Registry several times a week.
    stack: [django, postgresql, htmx, docker, github actions]
  - role: Backend Engineer
    org: SMGrader
    start: 2022-10
    end: 2025-11
    summary: >-
      An AI-powered grading platform: it grades student work and syncs the
      results with the school's learning system. Part-time and remote in a
      5-person team based in Melbourne, I built most of its server side over
      three years.
    results:
      - value: ~80%
        label: fewer repeated database reads after adding a shared cache
      - value: ~1 h to ~30 min
        label: to find out why a grading job failed
      - value: 15-20%
        label: fewer AI calls by stopping cancelled jobs early
    highlights:
      - REST API in Django REST Framework plus **4** async microservices on Celery, RabbitMQ and Redis.
      - Organization-level RBAC on Django's permission framework.
      - Stripe billing with per-user token budgets that cap AI usage per paid plan.
      - Background job system handling **~200** grading jobs a day; graceful cancellation via a Redis flag checked before any AI call.
      - Redis read-through cache with TTL for metadata shared across tasks.
      - Message-level logging and Grafana, Loki and Slack alerts co-designed with DevOps.
      - Two-way Canvas LMS integration (LTI and REST API) across **~20** courses.
      - AWS (RDS, S3, EKS, ElastiCache) deployed through Jenkins; supported Kubernetes scaling.
    stack: [drf, celery, rabbitmq, redis, stripe, aws, grafana]
  - role: Founder and Backend Engineer
    org: BanaDersBul
    url: https://www.banadersbul.com
    ref: side project
    start: 2021-01
    summary: >-
      A marketplace that matches students with private tutors in Turkey. I
      started it, built it and still run everything behind the site: accounts,
      search, file downloads and servers.
    results:
      - value: 5,000+
        label: registered users
      - value: 99.88%
        label: uptime
      - value: 78%
        label: lower monthly hosting cost
    highlights:
      - Flask REST API with SQLAlchemy (Alembic migrations) and PostgreSQL full-text search; documented in OpenAPI/Swagger.
      - Search results cached in Redis keyed by a query hash; repeat searches **10x** faster (**~300 ms** to **~30 ms**).
      - JWT auth for logins, secure file downloads, password resets and admin impersonation; Flask-Admin panel.
      - Ran production on DigitalOcean Kubernetes for **4** years with Helm charts, Nginx ingress with TLS, resource limits and scaling.
      - Then migrated to a self-managed Docker Compose server; dropping the Kubernetes overhead cut hosting cost **78%**.
      - One-click GitHub Actions deploys with SOPS + age encrypted secrets; hardened SSH, UFW firewall, fail2ban.
      - Docker images shrunk from **1.14 GB** to **199 MB**; **3** repos merged into a monorepo; build and push from **~10** to **~2 min**.
    stack: [flask, sqlalchemy, postgresql, redis, docker compose, caddy]
