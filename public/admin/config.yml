# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
# Sveltia CMS configuration: https://sveltiacms.app/en/docs
# Every save is a commit to `main`; the GitHub Actions workflow then rebuilds
# and deploys the site.

backend:
  name: github
  repo: burakuren/my-website
  branch: main
  base_url: https://sveltia-cms-auth.burakuren101.workers.dev
  commit_messages:
    create: 'content: create {{collection}} “{{slug}}”'
    update: 'content: update {{collection}} “{{slug}}”'
    delete: 'content: delete {{collection}} “{{slug}}”'
    uploadMedia: 'content: upload “{{path}}”'
    deleteMedia: 'content: delete “{{path}}”'

site_url: https://burakuren.com
display_url: https://burakuren.com
logo:
  src: /favicon.svg

media_folder: public/uploads
public_folder: /uploads

slug:
  encoding: ascii
  clean_accents: true

output:
  omit_empty_optional_fields: true

collections:
  - name: blog
    label: Blog
    label_singular: Post
    description: Posts under /blog/. Drafts are skipped in production builds.
    folder: src/content/blog
    path: '{{slug}}/index'
    # Images live next to each post so Astro can optimise them.
    media_folder: ''
    public_folder: ''
    extension: md
    format: frontmatter
    create: true
    slug:
      template: '{{title}}'
      # Lock the URL once a post is saved; renaming would break links.
      editable: [create]
      hint: Becomes /blog/<slug>/. Lowercase words separated by hyphens.
      pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', 'Use lowercase letters, numbers and hyphens only']
    preview_path: /blog/{{slug}}/
    sortable_fields:
      fields: [pubDate, title]
      default:
        field: pubDate
        direction: descending
    summary: '{{pubDate | date("YYYY-MM-DD")}} · {{title}}'
    view_filters:
      - label: Drafts
        field: draft
        pattern: true
    fields:
      - name: title
        label: Title
        widget: string
      - name: description
        label: Description
        widget: text
        hint: One or two sentences (max 200 characters). Used for the listing, search results and social cards.
        pattern: ['^[\s\S]{1,200}$', 'Keep it under 200 characters']
      - name: pubDate
        label: Publish date
        widget: datetime
        format: YYYY-MM-DD
        date_format: YYYY-MM-DD
        time_format: false
        default: '{{now}}'
      - name: updatedDate
        label: Last updated
        widget: datetime
        format: YYYY-MM-DD
        date_format: YYYY-MM-DD
        time_format: false
        required: false
        hint: Set this when you make a meaningful revision.
      - name: tags
        label: Tags
        widget: select
        multiple: true
        required: false
        options: [backend, devops, linux, python, django, databases, algorithms, notes]
        hint: Add new tags to this list in public/admin/config.yml.
      - name: cover
        label: Cover image
        widget: image
        required: false
        hint: Optional. Shown at the top of the post and used as the social card (cropped to 1200×630).
      - name: coverAlt
        label: Cover image alt text
        widget: string
        required: false
      - name: draft
        label: Draft
        widget: boolean
        default: true
        hint: Drafts are only visible in local development.
      - name: externalUrl
        label: Guest post URL
        widget: string
        required: false
        hint: 'For a post published on another site: its full URL. Leave the body empty; lists link out and no page is built here.'
      - name: publisher
        label: Guest post publisher
        widget: string
        required: false
        hint: Name of the site that published it, e.g. Teclado.
      - name: body
        label: Body
        widget: markdown
        required: false
        hint: 'Code fences take a title: ```ini title="api.socket". Callouts: > [!NOTE]. Image captions come from the image title.'

singletons:
  - name: profile
    label: Profile & home page
    file: src/data/profile.yml
    fields:
      - { name: name, label: Name, widget: string }
      - { name: handle, label: Handle, widget: string }
      - { name: role, label: Role, widget: string, hint: 'Shown in green under your name and used in structured data, e.g. "Backend Engineer".' }
      - { name: tagline, label: Tagline, widget: string, hint: One sentence under the name in the hero. }
      - { name: lead, label: Lead (hero), widget: text, hint: 'Short paragraph under the tagline. Wrap metrics in **double asterisks** to make them bold.' }
      - { name: availability, label: Availability, widget: string, required: false, hint: 'Shown beside the hero buttons with a green light, e.g. "Open to a new role or project". Leave empty to hide.' }
      - { name: seoTitle, label: SEO title, widget: string, hint: Home page <title>. Aim for 50-65 characters. }
      - { name: seoDescription, label: SEO description, widget: text, hint: Home page meta description. Aim for 140-160 characters. }
      - name: services
        label: How I can help
        widget: list
        required: false
        summary: '{{fields.flag}} {{fields.title}}'
        fields:
          - { name: flag, label: Flag, widget: string, hint: 'Mono label above the title, e.g. "--build".' }
          - { name: title, label: Title, widget: string }
          - { name: body, label: Body, widget: text }
          - { name: proof, label: For example, widget: text, required: false, hint: 'One line of proof. Wrap metrics in **double asterisks**.' }
      - name: about
        label: About paragraphs
        widget: list
        hint: The last paragraph is shown smaller and muted.
        field: { name: paragraph, label: Paragraph, widget: text }
      - name: facts
        label: About facts
        widget: list
        required: false
        summary: '{{fields.label}}: {{fields.value}}'
        fields:
          - { name: label, label: Label, widget: string }
          - { name: value, label: Value, widget: string, hint: 'Wrap metrics in **double asterisks**.' }
          - { name: sub, label: Muted line, widget: text, required: false, hint: Optional second line under the value. }
      - name: location
        label: Location (structured data)
        widget: object
        fields:
          - { name: city, label: City, widget: string }
          - { name: country, label: Country, widget: string }
      - { name: email, label: Email, widget: string, hint: 'Never printed in the page; shown as name[at]domain[dot]com and assembled on click.' }
      - { name: contactHeading, label: Contact heading, widget: string }
      - { name: contactText, label: Contact paragraph, widget: text, required: false }
      - name: contactSteps
        label: What happens next
        widget: list
        required: false
        hint: 'Numbered steps. Start each with its **bold lead**.'
        field: { name: step, label: Step, widget: text }
      - name: social
        label: Social links
        widget: list
        hint: Order is kept everywhere (LinkedIn first, then GitHub). Keys linkedin and github get icons.
        fields:
          - { name: key, label: Key, widget: string, hint: e.g. linkedin }
          - { name: label, label: Display text, widget: string, hint: e.g. LinkedIn }
          - { name: url, label: URL, widget: string }
      - { name: resume, label: CV path, widget: string, required: false, hint: Path to the CV PDF in public/ (e.g. /cv.pdf). Leave empty to hide the CV buttons. }
      - name: knowsAbout
        label: Topics (structured data)
        widget: list
        field: { name: topic, label: Topic, widget: string }
      - { name: alumniOf, label: University, widget: string, required: false }

  - name: experience
    label: Experience
    file: src/data/experience.yml
    fields:
      - name: entries
        label: Jobs (newest first)
        widget: list
        summary: '{{fields.org}} · {{fields.role}}'
        fields:
          - { name: role, label: Role, widget: string }
          - { name: org, label: Company, widget: string }
          - { name: url, label: URL, widget: string, required: false }
          - { name: ref, label: Git ref label, widget: string, required: false, hint: 'Small label under the dates. "HEAD" marks the current job with a green dot; e.g. "side project".' }
          - { name: start, label: Start (YYYY-MM), widget: string, pattern: ['^\d{4}-\d{2}$', 'Use YYYY-MM'] }
          - { name: end, label: End (YYYY-MM), widget: string, required: false, hint: 'Leave empty for "now".', pattern: ['^\d{4}-\d{2}$', 'Use YYYY-MM'] }
          - { name: summary, label: Summary, widget: text, hint: What the product is and what you did, in plain words. }
          - name: results
            label: Results
            widget: list
            required: false
            hint: Up to three boxes, each a big value and a label.
            summary: '{{fields.value}} {{fields.label}}'
            fields:
              - { name: value, label: Value, widget: string, hint: e.g. 5,000+ }
              - { name: label, label: Label, widget: string }
          - name: highlights
            label: Technical details
            widget: list
            required: false
            hint: 'Lines in the "Technical details" panel. Wrap metrics in **double asterisks**.'
            field: { name: highlight, label: Line, widget: text }
          - { name: stack, label: Stack tags, widget: list, required: false }

  - name: skills
    label: Skills
    file: src/data/skills.yml
    fields:
      - name: groups
        label: Rows
        widget: list
        summary: '{{fields.name}}'
        fields:
          - { name: name, label: Area, widget: string }
          - { name: tools, label: Tools, widget: text, hint: Comma-separated. }
