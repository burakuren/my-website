# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
# Sveltia CMS configuration: https://sveltiacms.app/en/docs
# Every save is a commit to `main`; the GitHub Actions workflow then rebuilds
# and deploys the site.

backend:
  name: github
  repo: burakuren/my-website
  branch: main
  base_url: https://sveltia-cms-auth.burakuren101.workers.dev
  commit_messages:
    create: 'content: create {{collection}} “{{slug}}”'
    update: 'content: update {{collection}} “{{slug}}”'
    delete: 'content: delete {{collection}} “{{slug}}”'
    uploadMedia: 'content: upload “{{path}}”'
    deleteMedia: 'content: delete “{{path}}”'

site_url: https://burakuren.com
display_url: https://burakuren.com
logo:
  src: /favicon.svg

media_folder: public/uploads
public_folder: /uploads

slug:
  encoding: ascii
  clean_accents: true

output:
  omit_empty_optional_fields: true

# Lab: only the glossary opts in (`i18n: true`); everything else stays English only.
i18n:
  structure: single_file
  locales: [en, tr]
  default_locale: en

collections:
  - name: blog
    label: Blog
    label_singular: Post
    description: Posts under /blog/. Drafts are skipped in production builds.
    folder: src/content/blog
    path: '{{slug}}/index'
    # Images live next to each post so Astro can optimise them.
    media_folder: ''
    public_folder: ''
    extension: md
    format: frontmatter
    create: true
    slug:
      template: '{{title}}'
      # Lock the URL once a post is saved; renaming would break links.
      editable: [create]
      hint: Becomes /blog/<slug>/. Lowercase words separated by hyphens.
      pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', 'Use lowercase letters, numbers and hyphens only']
    preview_path: /blog/{{slug}}/
    sortable_fields:
      fields: [pubDate, title]
      default:
        field: pubDate
        direction: descending
    summary: '{{pubDate | date("YYYY-MM-DD")}} · {{title}}'
    view_filters:
      - label: Drafts
        field: draft
        pattern: true
    fields:
      - name: title
        label: Title
        widget: string
      - name: description
        label: Description
        widget: text
        hint: One or two sentences (max 200 characters). Used for the listing, search results and social cards.
        pattern: ['^[\s\S]{1,200}$', 'Keep it under 200 characters']
      - name: pubDate
        label: Publish date
        widget: datetime
        format: YYYY-MM-DD
        date_format: YYYY-MM-DD
        time_format: false
        default: '{{now}}'
      - name: updatedDate
        label: Last updated
        widget: datetime
        format: YYYY-MM-DD
        date_format: YYYY-MM-DD
        time_format: false
        required: false
        hint: Set this when you make a meaningful revision.
      - name: tags
        label: Tags
        widget: select
        multiple: true
        required: false
        options: [backend, devops, linux, python, django, databases, notes]
        hint: Add new tags to this list in public/admin/config.yml.
      - name: cover
        label: Cover image
        widget: image
        required: false
        hint: Optional. Shown at the top of the post and used as the social card (cropped to 1200×630).
      - name: coverAlt
        label: Cover image alt text
        widget: string
        required: false
      - name: draft
        label: Draft
        widget: boolean
        default: true
        hint: Drafts are only visible in local development.
      - name: body
        label: Body
        widget: markdown
        hint: 'Code fences take a title: ```ini title="api.socket". Callouts: > [!NOTE]. Image captions come from the image title.'

  # ------------------------------------------------------------------
  # Lab: throwaway collections that exercise Sveltia features. /lab/
  # ------------------------------------------------------------------
  - divider: true

  # Categories as their own collection, referenced by notes and the glossary.
  - name: lab_categories
    label: Categories
    label_singular: Category
    icon: category
    description: Referenced from notes via a Relation field. Drag to reorder (writes `order`).
    folder: src/content/lab/categories
    extension: yml
    format: yaml
    identifier_field: name
    slug: '{{name}}'
    reorder: true
    thumbnail: icon
    preview_path: /lab/c/{{slug}}/
    summary: '{{name}} · {{description | truncate(40)}}'
    fields:
      - { name: name, label: Name, widget: string }
      - { name: description, label: Description, widget: text, required: false }
      - { name: color, label: Colour, widget: color, allowInput: true, default: '#97c58e' }
      - { name: icon, label: Icon, widget: image, required: false, hint: Shown as the thumbnail in the entry list. }

  # One folder, two CMS collections: the full notes view, and a filtered
  # "Links" view that only sees (and creates) entries with kind: link.
  - name: lab_notes
    label: Notes
    label_singular: Note
    icon: sticky_note_2
    description: Grouped by category, kind or year; filter by pinned, kind or rating.
    folder: src/content/lab/notes
    extension: md
    format: frontmatter
    preview_path: /lab/notes/{{slug}}/
    summary: '{{date | date("YYYY-MM-DD")}} · [{{kind | upper}}] {{title}}'
    sortable_fields:
      fields: [date, title, rating]
      default: { field: date, direction: descending }
    view_groups:
      default: category
      groups:
        - { name: category, label: Category, field: category }
        - { name: kind, label: Kind, field: kind }
        - { name: year, label: Year, field: date, pattern: '\d{4}' }
    view_filters:
      filters:
        - { name: pinned, label: Pinned, field: pinned, pattern: true }
        - { name: til, label: TIL, field: kind, eq: til }
        - { name: snippets, label: Snippets, field: kind, eq: snippet }
        - { name: favourites, label: '4+ stars', field: rating, gte: 4 }
    fields:
      - { name: title, label: Title, widget: string }
      - name: kind
        label: Kind
        widget: select
        options:
          - { label: Today I learned, value: til }
          - { label: Snippet, value: snippet }
          - { label: Link, value: link }
        default: til
      - name: category
        label: Category
        widget: relation
        collection: lab_categories
        value_field: '{{slug}}'
        display_fields: [name]
        search_fields: [name]
      - { name: tags, label: Tags, widget: list, required: false, hint: Comma separated. }
      - { name: date, label: Date, widget: datetime, type: date, format: YYYY-MM-DD, default: '{{now}}' }
      - { name: url, label: URL, widget: string, type: url, required: false }
      - { name: rating, label: Rating, widget: number, value_type: int, min: 1, max: 5, required: false, after_input: '/ 5' }
      - { name: pinned, label: Pinned, widget: boolean, default: false }
      - { name: body, label: Body, widget: richtext }

  - name: lab_links
    label: Links (filtered)
    label_singular: Link
    icon: link
    description: Same folder as Notes, filtered to kind = link. New entries get kind = link from a hidden field.
    folder: src/content/lab/notes
    extension: md
    format: frontmatter
    filter: { field: kind, value: link }
    preview_path: /lab/notes/{{slug}}/
    summary: '{{title}} → {{url}}'
    fields:
      - { name: title, label: Title, widget: string }
      - { name: kind, label: Kind, widget: hidden, default: link }
      - name: category
        label: Category
        widget: relation
        collection: lab_categories
        value_field: '{{slug}}'
        display_fields: [name]
      - { name: url, label: URL, widget: string, type: url }
      - { name: tags, label: Tags, widget: list, required: false }
      - { name: date, label: Date, widget: datetime, type: date, format: YYYY-MM-DD, default: '{{now}}' }
      - { name: rating, label: Rating, widget: number, value_type: int, min: 1, max: 5, required: false }
      - { name: pinned, label: Pinned, widget: boolean, default: false }
      - { name: body, label: Why it's worth reading, widget: richtext, required: false }

  # Nested collection: a folder tree up to three levels deep.
  - name: lab_docs
    label: Docs (nested)
    label_singular: Doc
    icon: account_tree
    description: A folder tree. Create sub-folders and move pages between them.
    folder: src/content/lab/docs
    extension: md
    format: frontmatter
    nested: { depth: 3, subfolders: false }
    meta: { path: { label: Folder } }
    sortable_fields: [weight, title]
    fields:
      - { name: title, label: Title, widget: string }
      - { name: weight, label: Sort weight, widget: number, value_type: int, default: 0 }
      - { name: body, label: Body, widget: richtext }

  # i18n: one YAML file per term holding both languages (single_file).
  - name: lab_glossary
    label: Glossary (en/tr)
    label_singular: Term
    icon: translate
    description: Translated entries. Switch locales in the editor; the category is copied across.
    folder: src/content/lab/glossary
    extension: yml
    format: yaml
    identifier_field: term
    i18n: true
    fields:
      - { name: term, label: Term, widget: string, i18n: true }
      - { name: definition, label: Definition, widget: text, i18n: true }
      - name: category
        label: Category
        widget: relation
        collection: lab_categories
        value_field: '{{slug}}'
        display_fields: [name]
        required: false
        i18n: duplicate

singletons:
  - name: profile
    label: Profile & home page
    file: src/data/profile.yml
    fields:
      - { name: name, label: Name, widget: string }
      - { name: handle, label: Handle, widget: string }
      - { name: role, label: Role, widget: string, hint: 'Used in the terminal card and structured data, e.g. "Backend Software Engineer".' }
      - { name: tagline, label: Tagline, widget: string, hint: 'Shown under your name as "- tagline".' }
      - { name: seoTitle, label: SEO title, widget: string, hint: Home page <title>. Aim for 50-65 characters. }
      - { name: seoDescription, label: SEO description, widget: text, hint: Home page meta description. Aim for 140-160 characters. }
      - name: synopsis
        label: Synopsis flags
        widget: list
        fields:
          - { name: flag, label: Flag, widget: string }
          - { name: arg, label: Argument, widget: string }
      - { name: description, label: Description (hero), widget: text }
      - name: about
        label: About paragraphs
        widget: list
        field: { name: paragraph, label: Paragraph, widget: text }
      - { name: status, label: Status, widget: string, hint: 'Shown as "active (running); <status>".' }
      - name: fetch
        label: Terminal card (fetch)
        widget: list
        fields:
          - { name: key, label: Key, widget: string }
          - { name: value, label: Value, widget: string }
      - name: location
        label: Location
        widget: object
        fields:
          - { name: city, label: City, widget: string }
          - { name: country, label: Country, widget: string }
      - { name: email, label: Email, widget: string }
      - { name: contactHeadline, label: Contact headline, widget: text }
      - name: social
        label: Social links
        widget: list
        fields:
          - { name: key, label: Label, widget: string, hint: e.g. github }
          - { name: label, label: Display text, widget: string }
          - { name: url, label: URL, widget: string }
      - { name: resume, label: CV path, widget: string, required: false, hint: Path to the CV PDF in public/ (e.g. /cv.pdf). Leave empty to hide the CV buttons. }
      - name: knowsAbout
        label: Topics (structured data)
        widget: list
        field: { name: topic, label: Topic, widget: string }
      - { name: alumniOf, label: University, widget: string, required: false }

  - name: projects
    label: Projects
    file: src/data/projects.yml
    fields:
      - name: projects
        label: Projects
        widget: list
        summary: '{{fields.name}}'
        fields:
          - { name: name, label: Name, widget: string }
          - name: kind
            label: Shown as
            widget: select
            options:
              - { label: Directory (name/), value: dir }
              - { label: File, value: file }
            default: dir
          - { name: url, label: URL, widget: string, required: false }
          - { name: description, label: Description, widget: text }
          - { name: tags, label: Tags, widget: list, required: false }

  - name: experience
    label: Experience
    file: src/data/experience.yml
    fields:
      - name: entries
        label: Entries (newest first)
        widget: list
        summary: '{{fields.role}} · {{fields.org}}'
        fields:
          - { name: role, label: Role or degree, widget: string }
          - { name: org, label: Company or school, widget: string }
          - { name: url, label: URL, widget: string, required: false }
          - name: kind
            label: Kind
            widget: select
            options: [work, education]
            default: work
          - { name: ref, label: Git ref label, widget: string, required: false, hint: 'e.g. "HEAD -> current" (green dot), "side-project", "init".' }
          - { name: start, label: Start (YYYY-MM), widget: string, pattern: ['^\d{4}-\d{2}$', 'Use YYYY-MM'] }
          - { name: end, label: End (YYYY-MM), widget: string, required: false, hint: Leave empty for "present"., pattern: ['^\d{4}-\d{2}$', 'Use YYYY-MM'] }
          - { name: note, label: Note, widget: string, required: false }
          - name: highlights
            label: Highlights
            widget: list
            required: false
            field: { name: highlight, label: Highlight, widget: text }

  - name: skills
    label: Skills
    file: src/data/skills.yml
    fields:
      - { name: comment, label: Comment line, widget: string, required: false }
      - name: groups
        label: Groups
        widget: list
        summary: '[{{fields.name}}]'
        fields:
          - { name: name, label: Section, widget: string }
          - name: items
            label: Items
            widget: list
            summary: '{{fields.key}} = {{fields.value}}'
            fields:
              - { name: key, label: Key, widget: string }
              - { name: value, label: Value, widget: string }
              - { name: comment, label: Comment, widget: string, required: false }

  - name: lab_widgets
    label: 'Lab: every field type'
    icon: widgets
    file: src/data/lab-widgets.yml
    preview_path: /lab/widgets/
    fields:
      - { name: uuid, label: UUID, widget: uuid, comment: Generated once and never edited. }
      - { name: title, label: String, widget: string, maxlength: 60 }
      - { name: slug, label: String with pattern, widget: string, pattern: ['^[a-z0-9-]+$', 'Lowercase, digits and hyphens'] }
      - { name: permalink, label: Compute, widget: compute, value: '/lab/widgets/#{{fields.slug}}', hint: Derived from the slug above. }
      - { name: summary, label: Text, widget: text, required: false }
      - { name: count, label: Number (int), widget: number, value_type: int, min: 0, after_input: items }
      - { name: price, label: Number (float), widget: number, value_type: float, step: 0.01, before_input: '€' }
      - { name: enabled, label: Boolean, widget: boolean }
      - { name: released, label: Date and time, widget: datetime }
      - { name: day, label: Date only, widget: datetime, type: date, format: YYYY-MM-DD }
      - { name: level, label: Select (radio), widget: select, options: [beginner, intermediate, advanced] }
      - { name: platforms, label: Select (multiple), widget: select, multiple: true, options: [linux, macos, windows, android] }
      - name: favourite_note
        label: Relation (filtered to snippets)
        widget: relation
        collection: lab_notes
        value_field: '{{slug}}'
        display_fields: [title]
        filters: [{ field: kind, values: [snippet] }]
        required: false
      - name: related_notes
        label: Relation (multiple)
        widget: relation
        collection: lab_notes
        value_field: '{{slug}}'
        display_fields: [title, kind]
        multiple: true
        required: false
      - { name: accent, label: Colour with alpha, widget: color, enableAlpha: true, allowInput: true }
      - { name: location, label: Map, widget: map, center: [28.9784, 41.0082], zoom: 10, required: false }
      - { name: snippet, label: Code, widget: code, default_language: python, required: false }
      - { name: env, label: Key-value, widget: keyvalue, key_label: Variable, value_label: Value, required: false }
      - { name: image, label: Image, widget: image, required: false }
      - { name: attachment, label: File, widget: file, required: false }
      - { name: links, label: List (simple), widget: list, field: { name: url, label: URL, widget: string }, required: false }
      - name: author
        label: Object
        widget: object
        collapsed: auto
        summary: '{{fields.name}}'
        fields:
          - { name: name, label: Name, widget: string }
          - { name: role, label: Role, widget: string, required: false }
      - { name: markdown, label: Rich text (Markdown), widget: richtext, required: false }
      - { name: schema_version, label: Hidden, widget: hidden, default: 1 }
      - name: blocks
        label: List with types (page builder)
        label_singular: Block
        widget: list
        required: false
        types:
          - { name: heading, label: Heading, widget: object, summary: '# {{fields.text}}', fields: [{ name: text, label: Text, widget: string }] }
          - { name: paragraph, label: Paragraph, widget: object, fields: [{ name: text, label: Text, widget: richtext }] }
          - name: callout
            label: Callout
            widget: object
            summary: '[{{fields.kind}}] {{fields.text}}'
            fields:
              - { name: kind, label: Kind, widget: select, options: [note, tip, warning], default: note }
              - { name: text, label: Text, widget: text }
          - name: link
            label: Link
            widget: object
            summary: '{{fields.label}} → {{fields.url}}'
            fields:
              - { name: label, label: Label, widget: string }
              - { name: url, label: URL, widget: string, type: url }

# Lab: a media library folder of its own, browsable under Assets.
asset_collections:
  - name: lab_media
    label: Lab media
    icon: photo_library
    media_folder: public/uploads/lab
    public_folder: /uploads/lab
