# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
# Sveltia CMS configuration: https://sveltiacms.app/en/docs
# Every save is a commit to `main`; the GitHub Actions workflow then rebuilds
# and deploys the site.

backend:
  name: github
  repo: burakuren/my-website
  branch: main
  base_url: https://sveltia-cms-auth.burakuren101.workers.dev
  commit_messages:
    create: 'content: create {{collection}} “{{slug}}”'
    update: 'content: update {{collection}} “{{slug}}”'
    delete: 'content: delete {{collection}} “{{slug}}”'
    uploadMedia: 'content: upload “{{path}}”'
    deleteMedia: 'content: delete “{{path}}”'

site_url: https://burakuren.com
display_url: https://burakuren.com
logo:
  src: /favicon.svg

media_folder: public/uploads
public_folder: /uploads

slug:
  encoding: ascii
  clean_accents: true

output:
  omit_empty_optional_fields: true

collections:
  - name: blog
    label: Blog
    label_singular: Post
    description: Posts under /blog/. Drafts are skipped in production builds.
    folder: src/content/blog
    path: '{{slug}}/index'
    # Images live next to each post so Astro can optimise them.
    media_folder: ''
    public_folder: ''
    extension: md
    format: frontmatter
    create: true
    slug:
      template: '{{title}}'
      # Lock the URL once a post is saved; renaming would break links.
      editable: [create]
      hint: Becomes /blog/<slug>/. Lowercase words separated by hyphens.
      pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', 'Use lowercase letters, numbers and hyphens only']
    preview_path: /blog/{{slug}}/
    sortable_fields:
      fields: [pubDate, title]
      default:
        field: pubDate
        direction: descending
    summary: '{{pubDate | date("YYYY-MM-DD")}} · {{title}}'
    view_filters:
      - label: Drafts
        field: draft
        pattern: true
    fields:
      - name: title
        label: Title
        widget: string
      - name: description
        label: Description
        widget: text
        hint: One or two sentences (max 200 characters). Used for the listing, search results and social cards.
        pattern: ['^[\s\S]{1,200}$', 'Keep it under 200 characters']
      - name: pubDate
        label: Publish date
        widget: datetime
        format: YYYY-MM-DD
        date_format: YYYY-MM-DD
        time_format: false
        default: '{{now}}'
      - name: updatedDate
        label: Last updated
        widget: datetime
        format: YYYY-MM-DD
        date_format: YYYY-MM-DD
        time_format: false
        required: false
        hint: Set this when you make a meaningful revision.
      - name: tags
        label: Tags
        widget: select
        multiple: true
        required: false
        options: [backend, devops, linux, python, django, databases, notes]
        hint: Add new tags to this list in public/admin/config.yml.
      - name: cover
        label: Cover image
        widget: image
        required: false
        hint: Optional. Shown at the top of the post and used as the social card (cropped to 1200×630).
      - name: coverAlt
        label: Cover image alt text
        widget: string
        required: false
      - name: draft
        label: Draft
        widget: boolean
        default: true
        hint: Drafts are only visible in local development.
      - name: body
        label: Body
        widget: markdown
        hint: 'Code fences take a title: ```ini title="api.socket". Callouts: > [!NOTE]. Image captions come from the image title.'

singletons:
  - name: profile
    label: Profile & home page
    file: src/data/profile.yml
    fields:
      - { name: name, label: Name, widget: string }
      - { name: handle, label: Handle, widget: string }
      - { name: role, label: Role, widget: string, hint: 'Used in the terminal card and structured data, e.g. "Backend Software Engineer".' }
      - { name: tagline, label: Tagline, widget: string, hint: 'Shown under your name as "- tagline".' }
      - { name: seoTitle, label: SEO title, widget: string, hint: Home page <title>. Aim for 50-65 characters. }
      - { name: seoDescription, label: SEO description, widget: text, hint: Home page meta description. Aim for 140-160 characters. }
      - name: synopsis
        label: Synopsis flags
        widget: list
        fields:
          - { name: flag, label: Flag, widget: string }
          - { name: arg, label: Argument, widget: string }
      - { name: description, label: Description (hero), widget: text }
      - name: about
        label: About paragraphs
        widget: list
        field: { name: paragraph, label: Paragraph, widget: text }
      - { name: status, label: Status, widget: string, hint: 'Shown as "active (running); <status>".' }
      - name: fetch
        label: Terminal card (fetch)
        widget: list
        fields:
          - { name: key, label: Key, widget: string }
          - { name: value, label: Value, widget: string }
      - name: location
        label: Location
        widget: object
        fields:
          - { name: city, label: City, widget: string }
          - { name: country, label: Country, widget: string }
      - { name: email, label: Email, widget: string }
      - { name: contactHeadline, label: Contact headline, widget: text }
      - name: social
        label: Social links
        widget: list
        fields:
          - { name: key, label: Label, widget: string, hint: e.g. github }
          - { name: label, label: Display text, widget: string }
          - { name: url, label: URL, widget: string }
      - { name: resume, label: CV path, widget: string, required: false, hint: Path to the CV PDF in public/ (e.g. /cv.pdf). Leave empty to hide the CV buttons. }
      - name: knowsAbout
        label: Topics (structured data)
        widget: list
        field: { name: topic, label: Topic, widget: string }
      - { name: alumniOf, label: University, widget: string, required: false }

  - name: projects
    label: Projects
    file: src/data/projects.yml
    fields:
      - name: projects
        label: Projects
        widget: list
        summary: '{{fields.name}}'
        fields:
          - { name: name, label: Name, widget: string }
          - name: kind
            label: Shown as
            widget: select
            options:
              - { label: Directory (name/), value: dir }
              - { label: File, value: file }
            default: dir
          - { name: url, label: URL, widget: string, required: false }
          - { name: description, label: Description, widget: text }
          - { name: tags, label: Tags, widget: list, required: false }

  - name: experience
    label: Experience
    file: src/data/experience.yml
    fields:
      - name: entries
        label: Entries (newest first)
        widget: list
        summary: '{{fields.role}} · {{fields.org}}'
        fields:
          - { name: role, label: Role or degree, widget: string }
          - { name: org, label: Company or school, widget: string }
          - { name: url, label: URL, widget: string, required: false }
          - name: kind
            label: Kind
            widget: select
            options: [work, education]
            default: work
          - { name: ref, label: Git ref label, widget: string, required: false, hint: 'e.g. "HEAD -> current" (green dot), "side-project", "init".' }
          - { name: start, label: Start (YYYY-MM), widget: string, pattern: ['^\d{4}-\d{2}$', 'Use YYYY-MM'] }
          - { name: end, label: End (YYYY-MM), widget: string, required: false, hint: Leave empty for "present"., pattern: ['^\d{4}-\d{2}$', 'Use YYYY-MM'] }
          - { name: note, label: Note, widget: string, required: false }
          - name: highlights
            label: Highlights
            widget: list
            required: false
            field: { name: highlight, label: Highlight, widget: text }

  - name: skills
    label: Skills
    file: src/data/skills.yml
    fields:
      - { name: comment, label: Comment line, widget: string, required: false }
      - name: groups
        label: Groups
        widget: list
        summary: '[{{fields.name}}]'
        fields:
          - { name: name, label: Section, widget: string }
          - name: items
            label: Items
            widget: list
            summary: '{{fields.key}} = {{fields.value}}'
            fields:
              - { name: key, label: Key, widget: string }
              - { name: value, label: Value, widget: string }
              - { name: comment, label: Comment, widget: string, required: false }
